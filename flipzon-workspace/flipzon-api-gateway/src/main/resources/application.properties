spring.application.name=flipzon-api-gateway

server.port=8081

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Discovery
spring.cloud.gateway.server.webmvc.discovery.locator.enabled=true
spring.cloud.gateway.server.webmvc.discovery.locator.lower-case-service-id=true

# -----------------------
# User Service
# -----------------------
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://FLIPZON-USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/users/**

# -----------------------
# -----------------------
# Product Service
# -----------------------
spring.cloud.gateway.server.webmvc.routes[1].id=product-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://FLIPZON-PRODUCT-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/products/**
# -----------------------
# Cart Service
# -----------------------
spring.cloud.gateway.server.webmvc.routes[2].id=cart-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://FLIPZON-CART-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/cart/**

# -----------------------
# Order Service
# -----------------------
spring.cloud.gateway.server.webmvc.routes[3].id=order-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://FLIPZON-ORDER-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/orders/**

# -----------------------
# Admin Service
# -----------------------
spring.cloud.gateway.server.webmvc.routes[4].id=admin-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://FLIPZON-ADMIN-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/admin/**